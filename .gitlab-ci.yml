# ============================================================
#  AURUM — GitLab CI/CD Pipeline  (AWS EC2 deploy)
#  Backend: Spring Boot (Maven, Java 17), Frontend: React + Vite
# ============================================================

stages:
  - build
  - test
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  paths:
    - .m2/repository
    - frontend/node_modules

# ------------------------------------------------------------
# 1-BOSQICH: BUILD
# ------------------------------------------------------------
build-backend:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  script:
    - cd backend
    - mvn -B clean package -DskipTests
  artifacts:
    paths:
      - backend/target/*.jar
    expire_in: 1 hour

build-frontend:
  stage: build
  image: node:20
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist
    expire_in: 1 hour

# ------------------------------------------------------------
# 2-BOSQICH: TEST
# ------------------------------------------------------------
test-backend:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  script:
    - cd backend
    - mvn -B test

# ------------------------------------------------------------
# 3-BOSQICH: DEPLOY (AWS EC2 ga SSH orqali)
# ------------------------------------------------------------
# GitLab > Settings > CI/CD > Variables bo'limiga qo'shilsin:
#   SSH_PRIVATE_KEY  -> .pem kalit faylining TO'LIQ matni
#   EC2_HOST         -> serverning public IP yoki DNS
#   EC2_USER         -> ubuntu (Ubuntu uchun) yoki ec2-user (Amazon Linux)
# ------------------------------------------------------------
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
  script:
    # --- BACKEND: jar faylni ko'chirib, xizmatni qayta ishga tushiramiz ---
    - scp backend/target/*.jar "$EC2_USER@$EC2_HOST:/home/$EC2_USER/aurum.jar"
    - ssh "$EC2_USER@$EC2_HOST" "sudo systemctl restart aurum"

    # --- FRONTEND: dist papkani nginx web root ga ko'chiramiz ---
    - scp -r frontend/dist/* "$EC2_USER@$EC2_HOST:/tmp/aurum-frontend/"
    - ssh "$EC2_USER@$EC2_HOST" "sudo rm -rf /var/www/aurum/* && sudo cp -r /tmp/aurum-frontend/* /var/www/aurum/ && sudo systemctl reload nginx"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
