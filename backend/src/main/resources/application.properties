# ===== Server =====
server.port=8080

# ===== PostgreSQL =====
# Create a database named "aurum_crm" in PostgreSQL before starting.
spring.datasource.url=jdbc:postgresql://localhost:5432/aurum_crm
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== Hibernate / JPA =====
# Tables are created/updated automatically by Hibernate on startup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===== File upload (product images) =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
aurum.upload.dir=uploads

# ===== JWT =====
# Use a long random base64-safe secret in production.
aurum.jwt.secret=ZmFrZS1zZWNyZXQta2V5LWZvci1hdXJ1bS1jcm0tY2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tMTIzNDU2Nzg5MA==
aurum.jwt.expiration-ms=86400000

# ===== CORS =====
aurum.cors.allowed-origins=http://localhost:3000

# ===== Admin shortcut account (per spec) =====
aurum.admin.login=ADMIN123
aurum.admin.password=6789

# ===== Inventory =====
aurum.inventory.low-stock-threshold=5
